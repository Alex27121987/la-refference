version: '3.8'
services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: la_refference
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
  backend:
    build: .
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:
      - "4000:4000"
    depends_on:
      - db
    volumes:
      - .:/app:delegated
    command: sh -c "npm install && npx prisma generate && npm run build && node dist/index.js"

volumes:
  db-data:
