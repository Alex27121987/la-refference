<!DOCTYPE html>

  <style>
    body { background: #1a1a1a; color: #fff; margin: 0; padding: 8px; }
    .search-container {
      background: #212121;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
    }
    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }
    .search-input {
      flex: 1;
      padding: 12px;
      background: #2c3e50;
      border: 2px solid #34495e;
      border-radius: 6px;
      color: #fff;
      font-size: 1rem;
      outline: none;
    }
    .search-input:focus {
      border-color: #3498db;
      box-shadow: 0 0 8px rgba(52, 152, 219, 0.5);
    }
    .search-btn {
      padding: 12px 30px;
      background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s;
    }
    .search-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(52, 152, 219, 0.4);
    }
    .results-container {
      background: #212121;
      border-radius: 8px;
      padding: 6px;
      max-height: 550px;
      overflow-y: auto;
    }
    .student-item {
      background: #2c3e50;
      padding: 4px 6px;
      margin-bottom: 2px;
      border-radius: 3px;
      transition: all 0.2s;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }
    .student-item:hover {
      background: #34495e;
    }
    .student-info {
      flex: 1;
      min-width: 0;
    }
    .student-name {
      font-size: 0.7rem;
      font-weight: bold;
      color: #3498db;
      margin-bottom: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.2;
    }
    .student-details {
      font-size: 0.65rem;
      color: #95a5a6;
      line-height: 1.2;
    }
    .quick-amount {
      width: 100px;
      padding: 2px 4px;
      background: #2c3e50;
      border: 1px solid #34495e;
      border-radius: 3px;
      color: #fff;
      font-size: 0.7rem;
      text-align: left;
    }
    .quick-amount:focus {
      outline: none;
      border-color: #3498db;
    }
    .select-btn {
      padding: 4px 10px;
      background: #27ae60;
      color: white;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.7rem;
      white-space: nowrap;
    }

      padding: 20px;
      border-radius: 8px;
      margin-top: 15px;
      display: none;
    }

    }
    .form-group {

    }
    .form-group label {
      display: block;
      margin-bottom: 6px;
      color: #bdc3c7;
      font-weight: 600;
      font-size: 0.9rem;
    }
    .form-group input,

      background: #2c3e50;
      border: 1px solid #34495e;
      border-radius: 5px;
      color: #fff;
      font-size: 0.95rem;
    }
    .form-group input:focus,
    .form-group select:focus {

      border-color: #3498db;

    }

      border-radius: 8px;

      border: none;

  <script>
    let selectedStudent = null;
    let allStudents = [];
    let currentClassFilter = 'maternelle-1';
    let lastSearchLetter = '';
    let currentPage = 0;
    const RESULTS_PER_PAGE = 15;
    let selectedIndex = -1;
    let currentResults = [];

    const MONTHLY_FEES = {
      'maternelle': 0,
      'primaire': 16500,
      '7ebe': 25000,
      '8ebe': 25000,
      'secondaire': 30000
    };

    function getMonthlyFee(classKey) {
      if (!classKey) return 0;
      if (classKey.startsWith('maternelle')) return MONTHLY_FEES.maternelle;
      if (classKey.startsWith('primaire')) return MONTHLY_FEES.primaire;
      if (classKey === 'secondaire-7EBE') return MONTHLY_FEES['7ebe'];
      if (classKey === 'secondaire-8EBE') return MONTHLY_FEES['8ebe'];
      if (classKey.startsWith('secondaire')) return MONTHLY_FEES.secondaire;
      return 0;
    }

    // Fonction pour obtenir le prochain mois impayé d'un élève
    // Accepte un second paramètre optionnel `paymentsArray` pour utiliser un tableau de paiements en mémoire
    function getNextUnpaidMonth(student, paymentsArray) {
      if (!student.dateInscription) return null;
      
      const inscriptionDate = new Date(student.dateInscription);
      const inscriptionDay = inscriptionDate.getDate();
      const inscriptionMonth = inscriptionDate.getMonth() + 1; // 1-12
      const inscriptionYear = inscriptionDate.getFullYear();
      
      // Déterminer le premier mois payable
      let firstPayableMonth = inscriptionMonth;
      let firstPayableYear = inscriptionYear;
      
      // RÈGLE SPÉCIALE AOÛT : Tous les élèves inscrits en août commencent à payer en septembre
      if (inscriptionMonth === 8) {
        firstPayableMonth = 9;
      } else if (inscriptionDay > 25) {
        // Si inscrit après le 25, le premier mois payable est le mois suivant
        firstPayableMonth++;
        if (firstPayableMonth > 12) {
          firstPayableMonth = 1;
          firstPayableYear++;
        }
      }
      
      // Récupérer tous les paiements mensuels de cet élève (pas les frais F)
      const payments = paymentsArray || JSON.parse(localStorage.getItem('cs_la_reference_payments') || '[]');
      const studentPayments = payments.filter(p => 
        p.studentId === student.id && !p.isTrimesterFee
      );
      
      // Créer un Map des montants payés par mois (format: "YYYY-MM" -> total)
      const paidAmounts = {};
      studentPayments.forEach(p => {
        const monthKey = `${p.year}-${String(p.month).padStart(2, '0')}`;
        paidAmounts[monthKey] = (paidAmounts[monthKey] || 0) + p.amount;
      });
      
      // Chercher le premier mois impayé depuis l'inscription jusqu'à maintenant
      const now = new Date();
      const currentYear = now.getFullYear();
      const currentMonth = now.getMonth() + 1;
      const currentDay = now.getDate();
      
      // Déterminer le dernier mois payable (mois précédent actuel)
      // Correction : si tous les mois jusqu'à décembre ne sont pas payés, décembre doit être payé avant janvier
      let lastDueMonth = currentMonth - 1;
      let lastDueYear = currentYear;
      if (lastDueMonth < 1) {
        lastDueMonth = 12;
        lastDueYear--;
      }

      // Si on est en janvier ou plus tard, s'assurer que décembre de l'année précédente est bien payé avant janvier
      // On ne saute pas décembre si impayé
      
      let checkMonth = firstPayableMonth;
      let checkYear = firstPayableYear;
      
      // Obtenir les frais mensuels de l'élève
      const monthlyFee = getMonthlyFee(student.classKey);
      
      while (checkYear < lastDueYear || (checkYear === lastDueYear && checkMonth <= lastDueMonth)) {
        const monthKey = `${checkYear}-${String(checkMonth).padStart(2, '0')}`;
        const alreadyPaid = paidAmounts[monthKey] || 0;
        
        // Si le mois n'est pas complètement payé, le retourner avec le montant déjà payé
        if (alreadyPaid < monthlyFee) {
          return { 
            month: checkMonth, 
            year: checkYear,
            alreadyPaid: alreadyPaid
          };
        }
        
        checkMonth++;
        if (checkMonth > 12) {
          checkMonth = 1;
          checkYear++;
        }
      }
      
      return null; // Tous les mois sont payés
    }

    function searchStudent() {
      const input = document.getElementById('searchInput');
      let query = input.value.trim().toLowerCase();
      
      if (!query) {
        document.getElementById('resultsContainer').style.display = 'none';
        lastSearchLetter = '';
        currentPage = 0;
        selectedIndex = -1;
        return;
      }

      // Recharger les élèves pour avoir les données à jour
      loadAllStudents();
      
      console.log(`🔎 RECHERCHE INITIÉE - Total élèves chargés: ${allStudents.length}`);
      console.log(`🎯 Filtre de classe actif: "${currentClassFilter}"`);
      console.log(`📝 Recherche textuelle: "${query}"`);

      // Réinitialiser la pagination et la sélection à chaque nouvelle recherche
      lastSearchLetter = query;
      currentPage = 0;
      selectedIndex = -1;

      let filteredStudents = allStudents;
      
      // Appliquer le filtre de classe (obligatoire)
      console.log(`\n--- FILTRAGE PAR CLASSE ---`);
      filteredStudents = allStudents.filter(s => {
        if (currentClassFilter.includes('1ere') || currentClassFilter.includes('2eme') || 
            currentClassFilter.includes('3eme') || currentClassFilter.includes('4eme')) {
          // Pour les classes avec options, utiliser startsWith pour inclure toutes les options
          const match = s.classKey && s.classKey.startsWith(currentClassFilter);
          if (match) {
            console.log(`  ✓ Élève trouvé: ${s.nom} ${s.prenom} (${s.classKey})`);
          }
          return match;
        }
        const exactMatch = s.classKey === currentClassFilter;
        if (exactMatch) {
          console.log(`  ✓ Élève trouvé (exact): ${s.nom} ${s.prenom} (${s.classKey})`);
        }
        return exactMatch;
      });
      
      console.log(`🔍 Après filtre classe: ${filteredStudents.length} élèves`);

      // Appliquer la recherche textuelle - commence par la chaîne tapée
      console.log(`\n--- FILTRAGE PAR TEXTE "${query}" ---`);
      const allResults = filteredStudents.filter(s => {
        const nom = (s.nom || '').toLowerCase();
        const postnom = (s.postnom || '').toLowerCase();
        const prenom = (s.prenom || '').toLowerCase();
        const matricule = (s.matricule || '').toLowerCase();
        
        const match = nom.startsWith(query) || 
                      postnom.startsWith(query) || 
                      prenom.startsWith(query) || 
                      matricule.startsWith(query);
        
        if (match) {
          console.log(`  ✓ Match: ${nom} ${postnom} ${prenom} (${s.classKey})`);
        }
        
        return match;
      });
      
      console.log(`\n📝 RÉSULTAT FINAL: ${allResults.length} élèves correspondent à "${query}" dans la classe "${currentClassFilter}"`);

      // Si on dépasse le nombre de pages, revenir au début
      const totalPages = Math.ceil(allResults.length / RESULTS_PER_PAGE);
      if (currentPage >= totalPages) {
        currentPage = 0;
      }

      // Extraire la page courante
      const start = currentPage * RESULTS_PER_PAGE;
      const end = start + RESULTS_PER_PAGE;
      const pagedResults = allResults.slice(start, end);
      
      // Sauvegarder les résultats actuels pour la navigation clavier
      currentResults = pagedResults;
      selectedIndex = -1;

      displayResults(pagedResults, allResults.length, currentPage + 1, totalPages);
    }

    function displayResults(results, totalResults = 0, currentPageNum = 1, totalPages = 1) {
      const container = document.getElementById('resultsContainer');
      
      if (results.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:#95a5a6; padding:20px;">Aucun élève trouvé</p>';
        container.style.display = 'block';
        return;
      }

      container.innerHTML = '';
      
      // Info des résultats
      if (totalResults > 0) {
        const pageInfo = document.createElement('div');
        pageInfo.style.cssText = 'padding: 6px; background: #34495e; border-radius: 4px; margin-bottom: 6px; text-align: center; font-size: 0.7rem; color: #ecf0f1;';
        pageInfo.innerHTML = `${totalResults} élève(s) trouvé(s) commençant par <span style="color:#3498db; font-weight:bold;">"${lastSearchLetter.toUpperCase()}"</span>`;
        container.appendChild(pageInfo);
      }
      
      results.forEach((student, idx) => {
        const fullName = `${student.nom || ''} ${student.postnom || ''} ${student.prenom || ''}`.trim();
        const classLabel = student.classKey ? student.classKey.replace(/-/g, ' ').toUpperCase() : 'N/A';
        const monthlyFee = getMonthlyFee(student.classKey);
        
        // Déterminer le prochain mois impayé et vérifier si paiement partiel
        const nextUnpaid = getNextUnpaidMonth(student);
        let monthInfo = '';
        if (nextUnpaid) {
          const monthNames = ['Jan', 'Fév', 'Mar', 'Avr', 'Mai', 'Jun', 'Jul', 'Aoû', 'Sep', 'Oct', 'Nov', 'Déc'];
          
          // Vérifier le montant déjà payé pour ce mois
          const payments = JSON.parse(localStorage.getItem('cs_la_reference_payments') || '[]');
          const monthPayments = payments.filter(p => 
            p.studentId === student.id && 
            p.month === nextUnpaid.month && 
            p.year === nextUnpaid.year && 
            !p.isTrimesterFee
          );
          const paidAmount = monthPayments.reduce((sum, p) => sum + (p.amount || 0), 0);
          const monthlyFee = getMonthlyFee(student.classKey);
          
          if (paidAmount > 0 && paidAmount < monthlyFee) {
            // Paiement partiel - afficher en orange
            const reste = monthlyFee - paidAmount;
            monthInfo = `<span style="color:#f39c12; font-weight:bold;">⚡ ${monthNames[nextUnpaid.month - 1]} ${nextUnpaid.year}: Reste ${reste} CDF</span>`;
          } else {
            // Impayé complet - afficher en rouge
            monthInfo = `<span style="color:#e74c3c; font-weight:bold;">⚠ Doit: ${monthNames[nextUnpaid.month - 1]} ${nextUnpaid.year}</span>`;
          }
        } else {
          monthInfo = `<span style="color:#27ae60;">✓ À jour</span>`;
        }
        
        const item = document.createElement('div');
        item.className = 'student-item';
        item.setAttribute('data-index', idx);
        item.setAttribute('data-student-id', student.id);
        item.style.transition = 'all 0.2s';
        item.innerHTML = `
          <div class="student-info">
            <div class="student-name">${fullName}</div>
            <div class="student-details">
              ${student.matricule || 'N/A'} | ${classLabel} | ${monthInfo}
            </div>
          </div>
          <div style="display:flex; gap:4px; align-items:center;" class="payment-fields" id="fields_${student.id}">
            <input type="number" class="quick-amount" id="amt_${student.id}" placeholder="Montant CDF" value="" style="width:100px;">
            <input type="date" id="date_${student.id}" value="" placeholder="Date" style="width:95px; padding:2px 4px; background:#2c3e50; border:1px solid #34495e; border-radius:3px; color:#fff; font-size:0.65rem; height:24px;">
            <label style="font-size:0.65rem; color:#ecf0f1; white-space:nowrap; display:flex; align-items:center; gap:2px;">
              <input type="checkbox" id="isF_${student.id}" style="width:14px; height:14px;">
              Frais F
            </label>
            <button class="select-btn" id="payBtn_${student.id}" style="display:none;">Confirmer</button>
          </div>
        `;
        
        container.appendChild(item);
      });

      container.style.display = 'block';
      // Appliquer des styles en ligne forcés pour garantir l'affichage uniforme
      try { forceCellStyle(); } catch(e){ console.warn('forceCellStyle failed', e); }
    }

    // Force l'application de styles en ligne sur les éléments résultats
    function forceCellStyle(){
      const items = document.querySelectorAll('.student-item');
      items.forEach(it => {
        // compact row to match target screenshot
        it.style.minHeight = '44px';
        it.style.display = 'flex';
        it.style.alignItems = 'center';
        it.style.padding = '6px 8px';

    function quickPay(studentId) {
      // Cette fonction n'est plus utilisée avec le nouveau système
      // On redirige vers le flux clavier
      startPaymentFlow(studentId);
      return;
      
      const amountInput = document.getElementById(`amt_${studentId}`);
      const dateInput = document.getElementById(`date_${studentId}`);
      const isFCheckbox = document.getElementById(`isF_${studentId}`);
      const amount = parseFloat(amountInput.value);
      
      if (!amount || amount <= 0) {
        showNotification('Veuillez entrer un montant valide', 'error');
        return;
      }
      
      if (!dateInput.value) {
        showNotification('⚠ Veuillez sélectionner la date de paiement', 'error');
        return;
      }
      
      const student = allStudents.find(s => s.id === studentId);
      if (!student) return;
      
      const isF = isFCheckbox.checked;
      const paymentDate = dateInput.value ? new Date(dateInput.value).toISOString() : new Date().toISOString();
      const payments = JSON.parse(localStorage.getItem('cs_la_reference_payments') || '[]');
      
      let month, year;
      if (isF) {
        // NOUVEAU SYSTÈME F: Distribuer le montant sur F1, F2, F3 indépendamment
        let remainingFAmount = amount;
        const createdPayments = [];
        
        while (remainingFAmount > 0) {
          const nextF = getNextUnpaidF(student.id);
          
          if (!nextF) {
            // Tous les F sont payés
            showNotification(`⚠ Tous les frais F sont payés. Excédent: ${remainingFAmount.toLocaleString()} CDF`, 'error');
            break;
          }
          
          // Allouer le montant au F actuel
          const amountForF = Math.min(remainingFAmount, nextF.remainingAmount);
          
          const fPayment = {
            id: 'pay_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9) + '_f',
            studentId: student.id,
            classKey: student.classKey,
            fType: nextF.fType,
            amount: amountForF,
            isFPayment: true,
            date: paymentDate,
            paidBy: 'Admin'
          };
          
          payments.push(fPayment);
          const newTotal = nextF.paidAmount + amountForF;
          const fRequired = F_AMOUNTS[nextF.fType];
          const status = newTotal >= fRequired ? '✓ Complet' : `Reste: ${fRequired - newTotal} CDF`;
          createdPayments.push(`${nextF.fType}: +${amountForF.toLocaleString()} CDF (${status})`);
          
          remainingFAmount -= amountForF;
        }
        
        if (createdPayments.length > 0) {
          localStorage.setItem('cs_la_reference_payments', JSON.stringify(payments));
          const fullName = `${student.nom || ''} ${student.postnom || ''} ${student.prenom || ''}`.trim();
          showNotification(`✓ Paiement F enregistré pour ${fullName}:\n${createdPayments.join('\n')}`, 'success');
          
          // Réinitialiser les champs
          amountInput.value = '';
          dateInput.value = '';
          isFCheckbox.checked = false;
          
          // Rafraîchir l'affichage
          searchStudent();
        }
        return;
      } else {
        // Pour les paiements mensuels, utiliser le prochain mois impayé
        const nextUnpaid = getNextUnpaidMonth(student);
        if (!nextUnpaid) {
          showNotification('⚠ Cet élève est à jour dans ses paiements', 'error');
          return;
        }
        month = nextUnpaid.month;
        year = nextUnpaid.year;
      
        const payment = {
          id: 'pay_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9),
          studentId: student.id,
          classKey: student.classKey,
          month: month,
          year: year,
          amount: amount,
          date: paymentDate,
          paidBy: 'Admin'
        };
        
        payments.push(payment);
        localStorage.setItem('cs_la_reference_payments', JSON.stringify(payments));
        
        const fullName = `${student.nom || ''} ${student.postnom || ''} ${student.prenom || ''}`.trim();
        const monthNames = ['Jan', 'Fév', 'Mar', 'Avr', 'Mai', 'Jun', 'Jul', 'Aoû', 'Sep', 'Oct', 'Nov', 'Déc'];
        const paymentType = `${monthNames[month - 1]} ${year}`;
        showNotification(`✓ Paiement enregistré: ${fullName} - ${amount.toLocaleString()} CDF (${paymentType})`, 'success');
        
        // Réinitialiser les champs
        amountInput.value = '';
        dateInput.value = '';
        isFCheckbox.checked = false;
        
        // Rafraîchir l'affichage pour mettre à jour le statut
        searchStudent();
      }

    function updatePaymentType() {
      const type = document.getElementById('paymentType').value;
      const trimesterGroup = document.getElementById('trimesterGroup');
      const monthlyAmountGroup = document.getElementById('monthlyAmountGroup');

      if (type === 'trimester') {
        trimesterGroup.style.display = 'block';
        monthlyAmountGroup.style.display = 'none';
        document.getElementById('trimesterAmount').value = '';
      } else if (type === 'both') {
        trimesterGroup.style.display = 'block';
        monthlyAmountGroup.style.display = 'block';
        document.getElementById('trimesterAmount').value = '';
      } else {
        trimesterGroup.style.display = 'none';
        monthlyAmountGroup.style.display = 'block';
      }
    }

    function submitPayment() {
      if (!selectedStudent) {
        showNotification('Aucun élève sélectionné', 'error');
        return;
      }

      const type = document.getElementById('paymentType').value;
      const month = parseInt(document.getElementById('paymentMonth').value);
      const monthlyAmount = parseFloat(document.getElementById('monthlyAmount').value) || 0;
      const trimesterAmount = parseFloat(document.getElementById('trimesterAmount').value) || 0;

      if (type === 'monthly' && monthlyAmount <= 0) {
        showNotification('Veuillez entrer un montant valide', 'error');
        return;
      }

      if (type === 'trimester' && trimesterAmount <= 0) {
        showNotification('Veuillez entrer un montant trimestriel valide', 'error');
        return;
      }

      if (type === 'both' && (monthlyAmount <= 0 || trimesterAmount <= 0)) {
        showNotification('Veuillez entrer les deux montants', 'error');
        return;
      }

      const currentMonth = new Date().getMonth() + 1;
      const currentYear = new Date().getFullYear();
      const schoolYear = currentMonth >= 9 ? currentYear : currentYear - 1;
      const year = month >= 9 ? schoolYear : schoolYear + 1;

      const payments = JSON.parse(localStorage.getItem('cs_la_reference_payments') || '[]');
      
      // NOUVEAU SYSTÈME: Gérer les paiements F et mensuels séparément
      if (type === 'trimester' || type === 'both') {
        // Traiter le paiement F
        let remainingFAmount = trimesterAmount;
        
        while (remainingFAmount > 0) {
          const nextF = getNextUnpaidF(selectedStudent.id);
          
          if (!nextF) {
            showNotification(`⚠ Tous les frais F sont payés. Excédent: ${remainingFAmount.toLocaleString()} CDF`, 'warning');
            break;
          }
          
          const amountForF = Math.min(remainingFAmount, nextF.remainingAmount);
          
          const fPayment = {
            id: 'pay_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9) + '_f',
            studentId: selectedStudent.id,
            classKey: selectedStudent.classKey,
            fType: nextF.fType,
            amount: amountForF,
            isFPayment: true,
            date: new Date().toISOString(),
            paidBy: 'Admin'
          };
          
          payments.push(fPayment);
          remainingFAmount -= amountForF;
        }
      }
      
      if (type === 'monthly' || type === 'both') {
        // Traiter le paiement mensuel
        const payment = {
          id: 'pay_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9),
          studentId: selectedStudent.id,
          classKey: selectedStudent.classKey,
          month: month,
          year: year,
          amount: monthlyAmount,
          date: new Date().toISOString(),
          paidBy: 'Admin'
        };
        payments.push(payment);
      }

      localStorage.setItem('cs_la_reference_payments', JSON.stringify(payments));

      const total = (type === 'monthly' ? monthlyAmount : type === 'trimester' ? trimesterAmount : monthlyAmount + trimesterAmount);
      showNotification(`Paiement enregistré avec succès: ${total.toLocaleString()} CDF`, 'success');

      // Réinitialiser le formulaire
      setTimeout(() => {
        cancelPayment();
        document.getElementById('searchInput').value = '';
      }, 1500);
    }

    function cancelPayment() {
      selectedStudent = null;
      document.getElementById('paymentForm').classList.remove('active');
      document.getElementById('resultsContainer').style.display = 'none';
    }

    // Variables globales pour l'état du paiement
    let paymentState = {
      mode: 'classes', // 'classes', 'search', 'amount', 'date', 'checkbox', 'confirm'
      selectedStudentId: null,
      amount: null,
      date: null,
      isF: false
    };
    
    let currentClassIndex = 0;
    const classButtons = [];
    
    // Recherche à chaque frappe avec gestion spéciale pour lettres répétées
    document.getElementById('searchInput').addEventListener('input', function(e) {
      searchStudent();
    });
    
    // Navigation au clavier GLOBALE
    document.addEventListener('keydown', function(e) {
      const items = document.querySelectorAll('.student-item');
      
      // Mode CLASSES: Navigation entre les boutons de classe
      if (paymentState.mode === 'classes') {
        if (e.key === 'ArrowRight') {
          e.preventDefault();
          currentClassIndex = (currentClassIndex + 1) % classButtons.length;
          updateClassSelection();
        } else if (e.key === 'ArrowLeft') {
          e.preventDefault();
          currentClassIndex = currentClassIndex <= 0 ? classButtons.length - 1 : currentClassIndex - 1;
          updateClassSelection();
        } else if (e.key === 'Enter') {
          e.preventDefault();
          const selectedBtn = classButtons[currentClassIndex];
          if (selectedBtn) {
            const classKey = selectedBtn.getAttribute('data-class');
            filterByClass(classKey);
            paymentState.mode = 'search';
            document.getElementById('searchInput').focus();
          }
        }
      }
      // Mode SEARCH: Navigation dans les résultats
      else if (paymentState.mode === 'search') {
        // Ne rien faire ici - la navigation est gérée dans searchInput.keydown
      }
      // Mode AMOUNT: Saisie du montant
      else if (paymentState.mode === 'amount') {
        if (e.key === 'ArrowRight') {
          e.preventDefault();
          const amt = parseFloat(document.getElementById(`amt_${paymentState.selectedStudentId}`).value);
          if (amt && amt > 0) {
            paymentState.amount = amt;
            paymentState.mode = 'date';
            // Focus sur le champ date
            const dateInput = document.getElementById(`date_${paymentState.selectedStudentId}`);
            if (dateInput) {
              dateInput.focus();
              dateInput.showPicker && dateInput.showPicker();
            }
          } else {
            showNotification('⚠ Veuillez saisir un montant valide', 'error');
          }
        } else if (e.key === 'Escape' || e.key === 'Backspace') {
          e.preventDefault();
          cancelPayment();
        }
      }
      // Mode DATE: Sélection de la date
      else if (paymentState.mode === 'date') {
        if (e.key === 'Enter') {
          e.preventDefault();
          const dateValue = document.getElementById(`date_${paymentState.selectedStudentId}`).value;
          if (dateValue) {
            paymentState.date = dateValue;
            // Vérifier l'état de la checkbox Frais F
            const isFChecked = document.getElementById(`isF_${paymentState.selectedStudentId}`).checked;
            paymentState.isF = isFChecked;
            paymentState.mode = 'confirm';
            showInlineConfirmation();
          } else {
            showNotification('⚠ Veuillez sélectionner une date', 'error');
          }
        } else if (e.key === 'ArrowRight') {
          e.preventDefault();
          const dateValue = document.getElementById(`date_${paymentState.selectedStudentId}`).value;
          if (dateValue) {
            paymentState.date = dateValue;
            // Focus sur la checkbox
            const checkbox = document.getElementById(`isF_${paymentState.selectedStudentId}`);
            if (checkbox) checkbox.focus();
          } else {
            showNotification('⚠ Veuillez sélectionner une date', 'error');
          }
        } else if (e.key === 'Backspace' || e.key === 'ArrowLeft') {
          e.preventDefault();
          paymentState.mode = 'amount';
          const amtInput = document.getElementById(`amt_${paymentState.selectedStudentId}`);
          if (amtInput) {
            amtInput.focus();
            amtInput.select();
          }
        } else if (e.key === 'Escape') {
          cancelPayment();
        }
      }

      // Mode CONFIRM: Confirmation finale
      else if (paymentState.mode === 'confirm') {
        if (e.key === 'Enter' || e.key === 'o' || e.key === 'O') {
          e.preventDefault();
          executePayment();
        } else if (e.key === 'Escape' || e.key === 'n' || e.key === 'N') {
          e.preventDefault();
          cancelPayment();
        }
      }
    });
    
    // Fonction pour mettre à jour la sélection des classes
    function updateClassSelection() {
      classButtons.forEach((btn, idx) => {
        if (idx === currentClassIndex) {
          btn.style.border = '3px solid #3498db';
          btn.style.transform = 'scale(1.1)';
          btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        } else {
          btn.style.border = '';
          btn.style.transform = '';
        }
      });
    }
    
    // Fonction pour mettre à jour la sélection visuelle des élèves
    function updateSelection(items) {
      const container = document.getElementById('resultsContainer');
      items.forEach((item, idx) => {
        if (idx === selectedIndex) {
          item.style.background = '#34495e';
          item.style.border = '2px solid #3498db';
          // Keep selected item visible using container scroll (works reliably with custom cell heights)
          try {
            const itemTop = item.offsetTop;
            const itemBottom = itemTop + item.offsetHeight;
            const viewTop = container.scrollTop;
            const viewBottom = viewTop + container.clientHeight;
            if (itemTop < viewTop) {
              container.scrollTop = itemTop - 8;
            } else if (itemBottom > viewBottom) {
              container.scrollTop = itemBottom - container.clientHeight + 8;
            }
          } catch (e) {
            // Fallback
            item.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
          }
        } else {
          item.style.background = '';
          item.style.border = '';
        }
      });
    }

    // Exécuter le paiement
    async function executePayment() {
      const student = allStudents.find(s => s.id === paymentState.selectedStudentId);
      if (!student) return;
      
      const isF = paymentState.isF;
      const paymentDate = new Date(paymentState.date).toISOString();
      const payments = JSON.parse(localStorage.getItem('cs_la_reference_payments') || '[]');
      
      // Extraire uniquement la date (sans heure) pour comparaison
      const paymentDateOnly = paymentState.date; // Format YYYY-MM-DD
      
      // Vérifier si un paiement existe déjà pour cet élève à cette date
      const existingPayments = payments.filter(p => 
        p.studentId === student.id && 
        p.date && 
        p.date.startsWith(paymentDateOnly)
      );
      
      if (existingPayments.length > 0) {
        const totalExisting = existingPayments.reduce((sum, p) => sum + (p.amount || 0) + (p.trimesterFee || 0), 0);
        const fullName = `${student.nom || ''} ${student.postnom || ''} ${student.prenom || ''}`.trim();
        const confirm = window.confirm(
          `⚠️ Il y a déjà ${existingPayments.length} paiement(s) enregistré(s) à cette date pour ${fullName}:\n` +
          `Total à cette date: ${totalExisting.toLocaleString()} CDF\n\n` +
          `Voulez-vous enregistrer un autre paiement à la même date?\n` +
          `Le nouveau montant (${paymentState.amount.toLocaleString()} CDF) sera ajouté.`
        );
        
        if (!confirm) {
          showNotification('Paiement annulé', 'error');
          // Remettre le focus sur le champ date
          paymentState.mode = 'date';
          const dateInput = document.getElementById(`date_${paymentState.selectedStudentId}`);
          if (dateInput) dateInput.focus();
          return;
        }
      }
      
      // Si c'est un paiement Frais F, traiter normalement
      if (isF) {
        const now = new Date();
        const payment = {
          id: 'pay_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9),
          studentId: student.id,
          classKey: student.classKey,
          month: now.getMonth() + 1,
          year: now.getFullYear(),
          amount: paymentState.amount,
          trimesterFee: paymentState.amount,
          isTrimesterFee: true,
          date: paymentDate,
          paidBy: 'Admin'
        };
        
        payments.push(payment);
        localStorage.setItem('cs_la_reference_payments', JSON.stringify(payments));
        
        const fullName = `${student.nom || ''} ${student.postnom || ''} ${student.prenom || ''}`.trim();
        showNotification(`✓ Paiement Frais F enregistré: ${fullName} - ${paymentState.amount.toLocaleString()} CDF`, 'success');
      } 
      // Sinon, c'est un paiement mensuel - répartir sur plusieurs mois si nécessaire
      else {
        const monthlyFee = getMonthlyFee(student.classKey);
        if (monthlyFee === 0) {
          showNotification('⚠ Impossible de déterminer le montant mensuel pour cette classe', 'error');
          cancelPayment();
          return;
        }
        
        let remainingAmount = paymentState.amount;
        const monthNames = ['Jan', 'Fév', 'Mar', 'Avr', 'Mai', 'Jun', 'Jul', 'Aoû', 'Sep', 'Oct', 'Nov', 'Déc'];
        const createdPayments = [];
        
        // Tant qu'il reste de l'argent à allouer
        while (remainingAmount > 0) {
          // Passer le tableau `payments` en mémoire pour que la fonction tienne compte
          // des paiements ajoutés pendant cette boucle (évite les doublons pour le même mois)
          const nextUnpaid = getNextUnpaidMonth(student, payments);
          if (!nextUnpaid) {
            // Plus de mois impayés - créer un paiement anticipé pour le prochain mois
            const now = new Date();
            let futureMonth = now.getMonth() + 2; // Mois prochain
            let futureYear = now.getFullYear();
            if (futureMonth > 12) {
              futureMonth = 1;
              futureYear++;
            }
            
            const amountForMonth = Math.min(remainingAmount, monthlyFee);
            const payment = {
              id: 'pay_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9),
              studentId: student.id,
              classKey: student.classKey,
              month: futureMonth,
              year: futureYear,
              amount: amountForMonth,
              trimesterFee: 0,
              isTrimesterFee: false,
              date: paymentDate,
              paidBy: 'Admin'
            };
            
            payments.push(payment);
            createdPayments.push(`${monthNames[futureMonth - 1]} ${futureYear}: ${amountForMonth.toLocaleString()} CDF`);
            remainingAmount -= amountForMonth;
            break;
          }
          
          // Calculer combien reste à payer pour ce mois (compléter d'abord le mois partiel)
          const remainingForMonth = monthlyFee - (nextUnpaid.alreadyPaid || 0);
          const amountForMonth = Math.min(remainingAmount, remainingForMonth);
          
          const payment = {
            id: 'pay_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9),
            studentId: student.id,
            classKey: student.classKey,
            month: nextUnpaid.month,
            year: nextUnpaid.year,
            amount: amountForMonth,
            trimesterFee: 0,
            isTrimesterFee: false,
            date: paymentDate,
            paidBy: 'Admin'
          };
          
          payments.push(payment);
          
          // Calculer le total payé pour ce mois après ce paiement
          const totalPaidForMonth = (nextUnpaid.alreadyPaid || 0) + amountForMonth;
          const statusIcon = totalPaidForMonth >= monthlyFee ? '✓' : `(${totalPaidForMonth.toLocaleString()}/${monthlyFee.toLocaleString()})`;
          
          createdPayments.push(`${monthNames[nextUnpaid.month - 1]} ${nextUnpaid.year}: ${amountForMonth.toLocaleString()} CDF ${statusIcon}`);
          remainingAmount -= amountForMonth;
          
          // Petit délai pour éviter les conflits d'ID
          await new Promise(resolve => setTimeout(resolve, 1));
        }
        
        localStorage.setItem('cs_la_reference_payments', JSON.stringify(payments));
        
        const fullName = `${student.nom || ''} ${student.postnom || ''} ${student.prenom || ''}`.trim();
        const paymentSummary = createdPayments.join(', ');
        showNotification(`✓ Paiement réparti: ${fullName} - ${paymentState.amount.toLocaleString()} CDF pour ${createdPayments.length} mois (${paymentSummary})`, 'success');
      }
      
      // Cacher le bouton et réinitialiser les champs
      const payBtn = document.getElementById(`payBtn_${paymentState.selectedStudentId}`);
      if (payBtn) payBtn.style.display = 'none';
      
      const amtInput = document.getElementById(`amt_${paymentState.selectedStudentId}`);
      const dateInput = document.getElementById(`date_${paymentState.selectedStudentId}`);
      const isFCheckbox = document.getElementById(`isF_${paymentState.selectedStudentId}`);
      
      if (amtInput) amtInput.value = '';
      if (dateInput) dateInput.value = '';
      if (isFCheckbox) isFCheckbox.checked = false;
      
      // Réinitialiser l'état
      paymentState = {
        mode: 'search',
        selectedStudentId: null,
        amount: null,
        date: null,
        isF: false
      };
      
      // Rafraîchir l'affichage
      searchStudent();
      
      // Focus sur la recherche
      document.getElementById('searchInput').focus();
    }

      }

    // Empêcher la répétition de la même lettre et gérer la navigation
    document.getElementById('searchInput').addEventListener('keydown', function(e) {
      const currentValue = this.value.trim().toLowerCase();
      const key = e.key.toLowerCase();
      
      // Gestion des flèches dans la barre de recherche
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        
        // Utiliser uniquement les items visibles dans le conteneur de résultats
        const resultsContainer = document.getElementById('resultsContainer');
        const items = resultsContainer.querySelectorAll('.student-item');
        
        if (paymentState.mode === 'search') {
          // Si ArrowUp et aucun élève sélectionné, retour aux classes
          if (e.key === 'ArrowUp' && selectedIndex < 0) {
            paymentState.mode = 'classes';
            document.getElementById('resultsContainer').style.display = 'none';
            updateClassSelection();
            return;
          }
          
          // Si ArrowUp et on est au premier élève, retour aux classes
          if (e.key === 'ArrowUp' && selectedIndex === 0) {
            selectedIndex = -1;
            paymentState.mode = 'classes';
            document.getElementById('resultsContainer').style.display = 'none';
            updateClassSelection();
            return;
          }
          
          if (items.length > 0) {
            if (e.key === 'ArrowDown') {
              selectedIndex = selectedIndex < 0 ? 0 : Math.min(selectedIndex + 1, items.length - 1);
            } else {
              selectedIndex = selectedIndex <= 0 ? items.length - 1 : selectedIndex - 1;
            }
            updateSelection(items);
          }
        }
        return;
      }
      
      // Enter pour sélectionner
      if (e.key === 'Enter' && paymentState.mode === 'search') {
        e.preventDefault();
        const resultsContainer = document.getElementById('resultsContainer');
        const items = resultsContainer.querySelectorAll('.student-item');
        if (selectedIndex >= 0 && selectedIndex < items.length) {
          const selectedItem = items[selectedIndex];
          const studentId = selectedItem.getAttribute('data-student-id');
          startPaymentFlow(studentId);
        }
        return;
      }
      
      // Backspace pour retourner aux classes si le champ est vide
      if (e.key === 'Backspace' && !currentValue && paymentState.mode === 'search') {
        e.preventDefault();
        paymentState.mode = 'classes';
        document.getElementById('resultsContainer').style.display = 'none';
        selectedIndex = -1;
        updateClassSelection();
        return;
      }
      
      // Si on tape la même lettre que celle déjà présente
      if (currentValue && key === currentValue && key.length === 1) {
        e.preventDefault();
        // Déclencher la recherche pour passer à la page suivante
        searchStudent();
      }
    });

        </div>
        <div style="background: #f39c12; padding: 12px 18px; border-radius: 6px; flex: 1; min-width: 150px;">
          <div style="font-size: 0.75rem; color: #fff3e0;">Frais trimestriels</div>
          <div style="font-size: 1.2rem; font-weight: bold; color: white;">${trimesterPayments.length}</div>
        </div>
      `;
      
      // Afficher dans le tableau
      displayPaymentHistory(enrichedPayments);
    }
    
    // Afficher les paiements dans le tableau
    function displayPaymentHistory(payments) {
      const tbody = document.getElementById('historyTableBody');
      
      if (payments.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 30px; color: #95a5a6;">Aucun paiement trouvé</td></tr>';
        return;
      }
      
      const monthNames = ['Jan', 'Fév', 'Mar', 'Avr', 'Mai', 'Jun', 'Jul', 'Aoû', 'Sep', 'Oct', 'Nov', 'Déc'];
      
      tbody.innerHTML = payments.map(p => {
        const date = new Date(p.date);
        const dateStr = `${String(date.getDate()).padStart(2, '0')}/${String(date.getMonth() + 1).padStart(2, '0')}/${date.getFullYear()}`;
        const monthStr = p.isTrimesterFee ? 'Frais F' : `${monthNames[p.month - 1]} ${p.year}`;
        const amount = (p.amount || 0) + (p.trimesterFee || 0);
        const type = p.isTrimesterFee ? '<span style="background: #f39c12; padding: 2px 8px; border-radius: 3px; font-size: 0.7rem;">Frais F</span>' : '<span style="background: #3498db; padding: 2px 8px; border-radius: 3px; font-size: 0.7rem;">Mensuel</span>';
        const classLabel = p.classKey ? p.classKey.replace(/-/g, ' ').toUpperCase() : 'N/A';
        
        return `
          <tr>
            <td>${dateStr}</td>
            <td><strong>${p.studentName}</strong><br><small style="color: #7f8c8d;">${p.studentMatricule}</small></td>
            <td>${classLabel}</td>
            <td>${monthStr}</td>
            <td style="font-weight: bold; color: #27ae60;">${amount.toLocaleString()} CDF</td>
            <td>${type}</td>
          </tr>
        `;
      }).join('');
    }
    
    // Filtrer l'historique
    function filterPaymentHistory() {
      const searchText = document.getElementById('historySearch').value.toLowerCase();
      const classFilter = document.getElementById('historyClassFilter').value;
      const monthFilter = document.getElementById('historyMonthFilter').value;
      
      const payments = JSON.parse(localStorage.getItem('cs_la_reference_payments') || '[]');
      const students = allStudents;
      
      // Enrichir et filtrer
      let filtered = payments.map(p => {
        const student = students.find(s => s.id === p.studentId);
        return {
          ...p,
          studentName: student ? `${student.nom || ''} ${student.postnom || ''} ${student.prenom || ''}`.trim() : 'Inconnu',
          studentMatricule: student ? student.matricule : 'N/A'
        };
      });
      
      // Filtrer par recherche
      if (searchText) {
        filtered = filtered.filter(p => 
          p.studentName.toLowerCase().includes(searchText) || 
          p.studentMatricule.toLowerCase().includes(searchText)
        );
      }
      
      // Filtrer par classe
      if (classFilter) {
        filtered = filtered.filter(p => p.classKey && p.classKey.startsWith(classFilter));
      }
      
      // Filtrer par mois
      if (monthFilter) {
        const month = parseInt(monthFilter);
        filtered = filtered.filter(p => p.month === month);
      }
      
      // Trier par date croissante (plus ancien en premier)
      filtered.sort((a, b) => new Date(a.date) - new Date(b.date));
      
      displayPaymentHistory(filtered);
    }
    
    // Fermer le modal en cliquant à l'extérieur
    document.addEventListener('click', function(e) {
      const modal = document.getElementById('historyModal');
      if (e.target === modal) {
        closePaymentHistory();
      }
    });

    // ===== RECHERCHE GLOBALE =====
    function openGlobalSearch() {
      const modal = document.getElementById('globalSearchModal');
      if (!modal) {
        createGlobalSearchModal();
      }
      document.getElementById('globalSearchModal').style.display = 'flex';
      document.getElementById('globalSearchInput').focus();
    }

    function closeGlobalSearch() {
      document.getElementById('globalSearchModal').style.display = 'none';
      document.getElementById('globalSearchInput').value = '';
      document.getElementById('globalSearchResults').innerHTML = '';
    }

    function createGlobalSearchModal() {
      const modalHTML = `
        <div id="globalSearchModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 10000; justify-content: center; align-items: center;">
          <div style="background: #212121; border-radius: 15px; width: 90%; max-width: 900px; max-height: 90vh; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,0.5);">
            <div style="background: linear-gradient(135deg, #9b59b6 0%, #8e44ad 100%); padding: 20px; display: flex; justify-content: space-between; align-items: center;">
              <h2 style="margin: 0; color: white; font-size: 1.5rem;">🔍 Rechercher un élève</h2>
              <button onclick="closeGlobalSearch()" style="background: rgba(255,255,255,0.2); border: none; color: white; font-size: 1.5rem; cursor: pointer; width: 40px; height: 40px; border-radius: 50%; font-weight: bold;">✕</button>
            </div>
            
            <div style="padding: 12px;">
              <div style="margin-bottom: 12px;">
                <input type="text" id="globalSearchInput" placeholder="Tapez le nom, postnom, prénom ou matricule..." style="width: 100%; padding: 12px; background: #2c3e50; border: 2px solid #34495e; border-radius: 8px; color: white; font-size: 1.05rem; outline: none;" onkeyup="performGlobalSearchPayment()">
                <p style="color: #95a5a6; font-size: 0.9rem; margin-top: 8px;">💡 Vous pouvez chercher plusieurs mots (ex: "KABILA JOSEPH")</p>
              </div>

              <style>
                /* Force a limited height for results so scrollbar stays inside modal */
                #globalSearchResults {
                  max-height: calc(80vh - 160px) !important;
                  overflow-y: auto !important;
                  padding: 6px !important;
                  margin: 0 !important;
                  box-sizing: border-box;
                }
                #globalSearchResults > div {
                  margin: 4px 0 !important;
                  padding: 6px !important;
                  display: flex !important;
                  align-items: center !important;
                  gap: 10px !important;
                  min-height: 44px !important;
                  overflow: hidden !important;
                  box-sizing: border-box !important;
                }
              </style>

              <div id="globalSearchResults"></div>
            </div>
          </div>
        </div>
      `;
      document.body.insertAdjacentHTML('beforeend', modalHTML);
    }

    function performGlobalSearchPayment() {
      const query = document.getElementById('globalSearchInput').value.trim().toLowerCase();
      const resultsDiv = document.getElementById('globalSearchResults');
      
      if (!query) {
        resultsDiv.innerHTML = '<p style="text-align: center; color: #95a5a6; padding: 40px;">Tapez pour rechercher...</p>';
        return;
      }

      loadAllStudents();
      const searchTerms = query.split(/\\s+/);
      
      const results = allStudents.filter(s => {
        const nom = (s.nom || '').toLowerCase();
        const postnom = (s.postnom || '').toLowerCase();
        const prenom = (s.prenom || '').toLowerCase();
        const matricule = (s.matricule || '').toLowerCase();
        const fullName = (nom + ' ' + postnom + ' ' + prenom).toLowerCase();
        
        return searchTerms.every(term => 
          nom.includes(term) || 
          postnom.includes(term) || 
          prenom.includes(term) || 
          matricule.includes(term) ||
          fullName.includes(term)
        );
      });

      if (results.length === 0) {
        resultsDiv.innerHTML = '<p style="text-align: center; color: #e74c3c; padding: 40px; font-size: 1.1rem;">❌ Aucun élève trouvé</p>';
        return;
      }

      let html = '<div style="margin-bottom: 15px; padding: 10px; background: #34495e; border-radius: 5px; color: white; font-weight: bold;">';
      html += results.length + ' élève(s) trouvé(s)';
      html += '</div>';

      results.forEach(student => {
        const classLabel = student.classKey ? student.classKey.replace(/-/g, ' ').toUpperCase() : 'N/A';
        const fullName = ((student.nom || '') + ' ' + (student.postnom || '') + ' ' + (student.prenom || '')).trim();

        // compact single-line result item (no extra margins)
        html += '<div style="background:#2c3e50; padding:6px; margin-bottom:6px; border-radius:6px; border-left:4px solid #9b59b6; display:flex; align-items:center; gap:10px; min-height:44px; overflow:hidden;">';
        html += '<div style="flex:1; min-width:0;">';
        html += '<div style="font-weight:700; color:#9b59b6; font-size:0.98rem; line-height:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">' + fullName + '</div>';
        html += '<div style="color:#bdc3c7; font-size:0.82rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">' + (student.matricule || 'N/A') + '  |  ' + classLabel + '</div>';
        html += '</div>';
        html += '<div style="flex:0 0 auto;">';
        html += '<button onclick="selectStudentFromSearch(\'' + student.id + '\')" style="background:#27ae60; color:#fff; border:none; padding:6px 10px; border-radius:5px; cursor:pointer; font-weight:700; font-size:0.85rem; white-space:nowrap;">✓ Sélectionner</button>';
        html += '</div>';
        html += '</div>';
      });

      resultsDiv.innerHTML = html;
      // Forcer styles sur les éléments du modal global (en cas de styles inline manquants)
      try { forceGlobalStyle(); } catch(e){ console.warn('forceGlobalStyle failed', e); }
    }

    function forceGlobalStyle(){
      const container = document.getElementById('globalSearchResults');
      if(!container) return;
      const nodes = Array.from(container.children).filter(n => n.tagName === 'DIV');
      nodes.forEach(n=>{
        n.style.minHeight = '44px';
        n.style.padding = '6px';
        n.style.display = 'flex';
        n.style.alignItems = 'center';
        n.style.boxSizing = 'border-box';
        n.style.overflow = 'hidden';
      });
    }

    function selectStudentFromSearch(studentId) {
      closeGlobalSearch();
      const student = allStudents.find(s => s.id === studentId);
      if (student) {
        startPaymentFlow(studentId);
      }
    }

    // Fermer le modal de recherche en cliquant à l'extérieur
    window.addEventListener('click', function(e) {
      const modal = document.getElementById('globalSearchModal');
      if (modal && e.target === modal) {
        closeGlobalSearch();
      }
    });

    // ========== NOUVEAU SYSTÈME DE PAIEMENT F ==========
    // Montants des frais F (définir selon besoin)
    const F_AMOUNTS = {
      F1: 50000, // Montant pour F1 (décembre)
      F2: 50000, // Montant pour F2 (mars)
      F3: 50000  // Montant pour F3 (juin)
    };

    // Récupérer les paiements F pour un élève
    function getStudentFPayments(studentId) {
      const payments = JSON.parse(localStorage.getItem('cs_la_reference_payments') || '[]');
      return payments.filter(p => p.studentId === studentId && p.isFPayment);
    }

    // Calculer le total payé pour un F spécifique (F1, F2 ou F3)
    function getFPaymentTotal(studentId, fType) {
      const fPayments = getStudentFPayments(studentId);
      return fPayments
        .filter(p => p.fType === fType)
        .reduce((sum, p) => sum + (p.amount || 0), 0);
    }

    // Obtenir le prochain F non complètement payé
    function getNextUnpaidF(studentId) {
      const fTypes = ['F1', 'F2', 'F3'];
      for (const fType of fTypes) {
        const totalPaid = getFPaymentTotal(studentId, fType);
        const requiredAmount = F_AMOUNTS[fType];
        if (totalPaid < requiredAmount) {
          return { fType, paidAmount: totalPaid, remainingAmount: requiredAmount - totalPaid };
        }
      }
      return null; // Tous les F sont payés
    }
  }  
  </script>
